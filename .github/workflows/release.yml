name: release

# Tag vX.Y.Z -> build binaries for macOS (arm64, x86_64) and Linux (x86_64,
# arm64), attest their provenance, and publish a GitHub release whose notes come
# from CHANGELOG.md. A manual run (workflow_dispatch) builds and smoke-tests
# everything but publishes nothing.
#
# crates.io: v0.1.0 was published by hand. To automate later, add the repo
# secret CARGO_REGISTRY_TOKEN and set the repo variable PUBLISH_TO_CRATES_IO=true.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match Cargo.toml version $version"; exit 1
          fi

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # 22.04 keeps the glibc requirement low (2.35) for older distros.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke test
        # An x86_64 macOS binary built on an arm64 runner can't be assumed to run there.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/release/recalla
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $name = "recalla-v$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/$env:TARGET/release/recalla.exe", LICENSE, README.md "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $h = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$h  $name.zip" | Out-File -Encoding ascii "dist/$name.zip.sha256"
      - name: Package
        if: runner.os != 'Windows'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          name="recalla-v${VERSION}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/recalla" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # build provenance
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && cat ./*.sha256 > SHA256SUMS && rm -- ./*.sha256 && cat SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::empty release notes"; exit 1; }
          cat >> notes.md <<'TXT'

          ---
          Install: `cargo install recalla` or `cargo binstall recalla`.
          Verify a download with `SHA256SUMS`, or `gh attestation verify <file> --repo damndeepesh/recalla`.
          TXT
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "recalla $TAG" --notes-file notes.md $flags

  publish-crate:
    if: github.ref_type == 'tag' && vars.PUBLISH_TO_CRATES_IO == 'true'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
