[package]
name = "recalla"
version = "0.3.2"
edition = "2024"
rust-version = "1.85"
description = "Local-first memory engine for coding agents: backfilled, provenance-linked, code-anchored memories."
license = "Apache-2.0"
repository = "https://github.com/damndeepesh/recalla"
readme = "README.md"
keywords = ["ai", "agents", "memory", "mcp", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Keep the published crate to what users need; internal agent state, CI and
# dev-only docs stay in the repo.
exclude = ["bench/", ".agent/", "scripts/", "web/", ".github/", ".claude/", ".gitleaks.toml", "CLAUDE.md", "AGENTS.md", "Makefile", "rust-toolchain.toml"]

# `cargo binstall recalla` downloads the prebuilt binary from the GitHub release.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/recalla-v{ version }-{ target }.tar.gz"
bin-dir = "recalla-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lib]
path = "src/lib.rs"

[[bin]]
name = "recalla"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.43", features = ["bundled"] }
thiserror = "2"
streaming-iterator = "0.1"
tree-sitter = "0.27"
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
httparse = "1"
zstd = "0.13"
getrandom = "0.4"

[features]
default = ["lang-rust", "lang-python", "lang-go", "lang-ts", "lang-js"]
lang-rust = ["dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
lang-ts = ["dep:tree-sitter-typescript"]
lang-js = ["dep:tree-sitter-javascript"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3"
