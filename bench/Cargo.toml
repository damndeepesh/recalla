[package]
name = "membench"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Neutral benchmark for coding-agent memory tools, built from public git history."
license = "Apache-2.0"
publish = false

# Standalone: not part of the recalla package or its dependency graph.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
